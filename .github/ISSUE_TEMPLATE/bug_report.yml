name: Bug Report
description: File a bug report to help improve SimBoard.
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this form for defects, including UI/UX and accessibility problems. Use Enhancement Request for new capabilities or improvements. Maintainers can add `ui/ux` during triage.

        Do not report vulnerabilities or share sensitive data in public issues. Use [GitHub private vulnerability reporting](https://github.com/E3SM-Project/simboard/security/advisories/new).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        Describe what you were trying to do and what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: |
        List the steps to reproduce the issue.
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: |
        Describe what you expected to happen.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Include the affected component (backend, frontend, ingestion, or tooling), commit or release version, and relevant runtime and configuration details. Remove secrets.
      placeholder: |
        Affected component:
        Commit or release version:
        OS or HPC site:
        Relevant runtime versions (Python, uv, Node.js, pnpm, browser):
        Relevant configuration (no secrets):
    validations:
      required: false

  - type: textarea
    id: code-or-screenshots
    attributes:
      label: Relevant code or screenshots
      description: |
        Paste any relevant code snippets or screenshots.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: |
        Any other information?
    validations:
      required: false

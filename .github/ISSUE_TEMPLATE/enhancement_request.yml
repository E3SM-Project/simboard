name: Enhancement Request
description: Suggest an enhancement for SimBoard.
title: "[Enhancement]: "
labels: ["enhancement"]
assignees: []
body:
    - type: markdown
      attributes:
          value: |
              Use this form for new capabilities and improvements, including UI/UX and accessibility work. Use Bug Report for existing behavior that is broken. Maintainers can add `ui/ux` during triage.

              Do not report vulnerabilities or share sensitive data in public issues. Use [GitHub private vulnerability reporting](https://github.com/E3SM-Project/simboard/security/advisories/new).

    - type: textarea
      id: description
      attributes:
          label: Is your feature request related to a problem?
          description: |
              Please do a quick search of existing issues to make sure that this has not been asked before.
              Please provide a clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
      validations:
          required: false

    - type: textarea
      id: solution
      attributes:
          label: Describe the solution you'd like
          description: |
              A clear and concise description of what you want to happen.
      validations:
          required: true

    - type: textarea
      id: acceptance-criteria
      attributes:
          label: Acceptance criteria
          description: List observable outcomes that will show this enhancement is complete. Describe behavior or results, not implementation steps.
          placeholder: |
              - Given ..., when ..., then ...
              - Completion can be verified by ...
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Describe alternatives you've considered
          description: |
              A clear and concise description of any alternative solutions or features you've considered.
      validations:
          required: false

    - type: textarea
      id: additional-context
      attributes:
          label: Additional context
          description: |
              Add any other context about the feature request here.
      validations:
          required: false

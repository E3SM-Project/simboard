name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - .pre-commit-config.yaml
      - .github/workflows/backend-ci.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - .pre-commit-config.yaml
      - .github/workflows/backend-ci.yml
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # --------------------------------------------------
      # General
      # --------------------------------------------------
      ENV: "test"
      ENVIRONMENT: "test"
      DOMAIN_URL: "https://example.com"
      STACK_NAME: "simboard"
      PORT: "8000"

      # --------------------------------------------------
      # Frontend (required by backend config)
      # --------------------------------------------------
      FRONTEND_ORIGIN: "https://127.0.0.1:5173"
      FRONTEND_AUTH_REDIRECT_URL: "https://127.0.0.1:5173/auth/callback"
      FRONTEND_ORIGINS: "https://127.0.0.1:5173"

      # --------------------------------------------------
      # Database
      # --------------------------------------------------
      DATABASE_URL: "postgresql+psycopg://simboard:simboard@localhost:5432/simboard"
      TEST_DATABASE_URL: "postgresql+psycopg://simboard:simboard@localhost:5432/simboard_test"

      # --------------------------------------------------
      # GitHub OAuth (dummy values for CI)
      # --------------------------------------------------
      GITHUB_CLIENT_ID: "dummy"
      GITHUB_CLIENT_SECRET: "dummy"
      GITHUB_REDIRECT_URL: "http://localhost/api/v1/auth/github/callback"
      GITHUB_STATE_SECRET_KEY: "dummy"

      # --------------------------------------------------
      # Cookie config
      # --------------------------------------------------
      COOKIE_NAME: "simboard_auth"
      COOKIE_SECURE: "false"
      COOKIE_HTTPONLY: "true"
      COOKIE_SAMESITE: "lax"
      COOKIE_MAX_AGE: "3600"

    steps:
      # -------------------------
      # Skip duplicate runs
      # -------------------------
      - name: Skip duplicate runs
        uses: fkirc/skip-duplicate-actions@v5
        with:
          github_token: ${{ github.token }}
          skip_after_successful_duplicate: true
          cancel_others: true

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PostgreSQL
        env:
          PGPASSWORD: simboard
        run: |
          # Match local Compose and the deployed PostgreSQL major version.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17
          # Stop other clusters before assigning the standard port to PostgreSQL 17.
          sudo systemctl stop postgresql
          sudo pg_conftool 17 main set port 5432
          sudo pg_ctlcluster 17 main start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE simboard WITH LOGIN PASSWORD 'simboard' CREATEDB;"
          sudo -u postgres createdb --owner=simboard simboard
          test "$(psql -h localhost -p 5432 -U simboard -d simboard -Atc "SELECT current_setting('server_version_num')::int / 10000")" = 17

      # -------------------------
      # Python
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # -------------------------
      # Install uv
      # -------------------------
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # -------------------------
      # Cache uv + dependencies
      # -------------------------
      - name: Cache uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-

      # -------------------------
      # Install backend deps
      # -------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv venv .venv
          uv sync --all-groups

      # -------------------------
      # Cache pre-commit
      # -------------------------
      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # -------------------------
      # Run pre-commit
      # -------------------------
      - name: Run pre-commit (backend only)
        env:
          SKIP: frontend-eslint,frontend-prettier
        run: |
          uv run --project backend pre-commit run --all-files

      # -------------------------
      # Run pytest
      # -------------------------
      - name: Run pytest
        # NOTE:
        # Pytest (and Alembic) must run from the backend directory so relative paths
        # like alembic.ini and script_location resolve correctly. `--project` only
        # selects the virtualenv; it does not change the working directory.
        working-directory: backend
        run: |
          uv run pytest --strict-markers

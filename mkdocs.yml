site_name: SimBoard Docs
site_description: Developer, architecture, CI/CD, and operations documentation for SimBoard.
site_url: https://simboard.readthedocs.io/
repo_url: https://github.com/E3SM-Project/simboard
repo_name: E3SM-Project/simboard
docs_dir: docs
theme:
  name: material
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: README.md
  - User Guide:
      - Overview: user/index.md
      - Publish Diagnostics Links: user/diagnostics.md
      - Ingestion Coverage: user/ingestion-coverage.md
  - Developer:
      - Developer Guide: developer/index.md
      - Assistant LLM Setup: developer/assistant-llm-setup.md
      - Backend Guide: backend/README.md
      - Frontend Guide: frontend/README.md
  - Architecture:
      - Metadata Ingestion: architecture/metadata-ingestion.md
      - Diagnostics Linkage: architecture/diagnostics-linkage.md
  - Operations:
      - CI/CD: cicd/README.md
      - Operations Overview: operations/index.md
      - Deployment and Release: operations/deployment-and-release.md
      - NERSC Spin Ingestion Operations Runbook: operations/nersc-spin-runbook.md
      - Set Up Ingestion Operations: operations/setup-ingestion-operations.md
      - Test Ingestion Operations: operations/test-ingestion-operations.md
      - HPC API Token Authentication: operations/hpc-api-token-authentication.md
      - Read-Only Database Access: operations/read-only-database-access.md

exclude: "docs|node_modules|migrations|.git|.tox|frontend|.vite"
default_stages: [pre-commit]
fail_fast: true

# To update pre-commit hooks, run `pre-commit autoupdate` in the terminal.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      # Sort the imports
      - id: ruff
        name: ruff-sort-imports
        args: [--select, I, --fix]
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty (type checking)
        entry: >
          bash -c 'cd "$(git rev-parse --show-toplevel)/backend" && uv run ty check'
        language: system
        pass_filenames: false
        files: ^(?:backend/)?app/.*\.py$
